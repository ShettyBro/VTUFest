<!DOCTYPE html>
<html lang="en">

<head>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@100;200;300;400;500;600;700;800;900&display=swap"
    rel="stylesheet" />

  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>VTU HABBA 2026</title>

  <!-- PWA / Mobile App Meta -->
  <meta name="theme-color" content="#0a1628" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="VTU HABBA" />
  <meta name="application-name" content="VTU HABBA 2026" />
  <meta name="description"
    content="VTU HABBA 2026 – Official Cultural Fest Management Portal for Students, Managers and Principals" />

  <!-- Favicons & Manifest -->
  <link rel="apple-touch-icon" sizes="180x180" href="/favicon/apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/favicon/favicon-16x16.png">
  <link rel="manifest" href="/favicon/site.webmanifest">
  <link rel="shortcut icon" href="/favicon/favicon.ico">
</head>

<body>
  <div id="root"></div>
  <!-- Capture PWA install prompt early — before React mounts (fixes race condition) -->
  <script>
    window.__pwaPrompt = null;
    window.addEventListener('beforeinstallprompt', function (e) {
      e.preventDefault();
      window.__pwaPrompt = e;
      // Dispatch a custom event so React components can react to it
      window.dispatchEvent(new Event('pwapromptready'));
    });
  </script>
  <script type="module" src="/src/main.jsx"></script>

  <!-- Register Service Worker (required for Chrome Android PWA install prompt) -->
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function () {
        navigator.serviceWorker.register('/sw.js', { scope: '/' })
          .then(function (reg) {
            console.log('[SW] Registered, scope:', reg.scope);
          })
          .catch(function (err) {
            console.warn('[SW] Registration failed:', err);
          });
      });
    }
  </script>
</body>

</html>
